<div style="flex:1;">
<p><strong>Common-mode cancels only when R_1/R_2 = R_3/R_4 exactly — and only when nothing else loads the inputs.</strong></p>
<div style="display:flex;gap:24px;margin-top:14px;">
<div style="flex:1;">
<p><strong>Limitation 1 — Finite Z_in</strong></p>
<ul>
<li>v_1 source sees <strong>R_1</strong> (to virtual ground)</li>
<li>v_2 source sees <strong>R_3 + R_4</strong> (to actual ground)</li>
<li>Bridge Z_out ≈ kΩ scale of bridge arms</li>
<li>Voltage divider forms at the input</li>
<li><strong>Gain depends on bridge resistance</strong></li>
</ul>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:20px;">
<p><strong>Limitation 2 — Resistor mismatch</strong></p>
<ul>
<li>CMRR exact only with perfect matching</li>
<li>1% resistors → 1% ratio mismatch</li>
<li>V_CM ≈ V_ref/2 = 2.5 V</li>
<li>1% of 2.5 V = 25 mV error</li>
<li>Signal is only <strong>0.5 mV</strong> at 500 g</li>
</ul>
</div>
</div>
<p><em>Numbers on the next slide.</em></p>
</div>

<h2 id="the-design-requirement-%E2%86%92-the-three-op-amp-ina">The Design Requirement → The Three-Op-Amp INA</h2>
<div style="display:flex;gap:32px;align-items:flex-start;margin-top:6px;">
<div style="flex:1;">
<p><strong>What the next-stage amplifier must provide:</strong></p>
<p><strong>1. Input impedance much higher than the bridge</strong></p>
<ul>
<li>No voltage divider at the input</li>
<li>Gain independent of source impedance</li>
</ul>
<p><strong>2. CMRR that does not depend on discrete resistor tolerance</strong></p>
<ul>
<li>Matching must come from on-chip trim</li>
<li>External components must not set CMRR</li>
</ul>
<p><strong>The three-op-amp instrumentation amplifier provides both →</strong></p>

<h2 id="output-stage-and-cmrr">Output Stage and CMRR</h2>
<p><strong>Output stage = single op-amp difference amplifier — but inside the chip.</strong></p>
<div style="display:flex;gap:40px;margin-top:14px;">
<div style="flex:1;">
<p><strong>What the output stage sees</strong></p>
<ul>
<li>Input-stage differential output: large (amplified)</li>
<li>Input-stage common-mode output: same as input common-mode</li>
<li>Differential-to-common-mode ratio is now huge</li>
</ul>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:26px;">
<p><strong>Why this works on-chip but not on a breadboard</strong></p>
<ul>
<li>Matching resistors are laser-trimmed at manufacture</li>
<li>All four on the same die, same temperature</li>
<li>CMRR set by silicon, not by your component drawer</li>
</ul>
</div>
</div>
<p><em>Limitation 1 (input impedance) solved by topology. Limitation 2 (CMRR) solved by integration.</em></p>
</section>

<div style="flex:1;">
<p><strong>One external resistor sets the INA gain.</strong></p>
<ul>
<li>All op-amps, all internal R_1, all output-stage resistors: on-chip</li>
<li>R_g is the only component the team selects</li>
</ul>
<p><strong>The team picks R_g</strong> based on the gain split chosen in Segment 3 and the practical constraint that R_g must stay well above contact resistance (a few ohms on a breadboard) to keep gain error below 1%.</p>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:26px;">
<p><strong>The INA does not provide all the gain.</strong></p>
<p>Bridge produces ~0.5 mV at full design load.<br />
ADC wants ±2.5 V (5 V swing).<br />
Total gain ≈ <strong>10,000</strong>.</p>
<p>The INA125 can do part of that. The <strong>summing amplifier supplies the rest</strong> — and also adds the offset.</p>
<p><em>Segment 3 explains why and how.</em></p>
</div>
</div>
</section>

<div style="display:flex;gap:32px;margin-top:14px;align-items:flex-start;">
<div style="flex:1;">
<p><strong>Ranges to meet</strong></p>
<ul>
<li><strong>Bridge signal:</strong> 0 → <strong>0.5 mV</strong>   (over 0–500 g design range)</li>
<li><strong>ADC input window:</strong> <strong>−2.5 V → +2.5 V</strong>   (5 V range, 12-bit)</li>
<li><strong>Endpoint mapping:</strong> 0 g → +2.5 V  |  500 g → −2.5 V</li>
</ul>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:24px;">
<p><strong>What the signal chain must do</strong></p>
<ul>
<li><strong>Total gain ≈ 10,000</strong>   (= 5 V ÷ 0.5 mV)</li>
<li>Add a <strong>DC offset</strong> so the output is centered on the ADC, not pinned to a rail</li>

<p><strong>Why that breaks on a breadboard</strong></p>
<p>Contact resistance is <strong>a few ohms</strong> — comparable to R_g itself.</p>
<p>Gain is then set by <em>how hard you push the wire into the hole</em>, not by the resistor.</p>
<p><strong>Rule of thumb:</strong> keep contact R under <strong>1% of R_g</strong>.</p>

<p><strong>Why this is the right move</strong></p>
<ul>
<li>Both stages run at sensible gains — neither one is at the edge of its parts.</li>
<li>The summing amp is doing <strong>two jobs</strong> — adding remaining gain <strong>and</strong> adding the offset.</li>
<li>The pre-lab grades the split: not just <em>that</em> you split, but <em>why</em>.</li>

<p><strong>Endpoints (always):</strong></p>
<table>
<thead>
<tr>
<th>W (g)</th>
<th>v_ADC</th>
<th>Check</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>+2.5 V</td>
<td>✓ no load</td>
</tr>
<tr>
<td>500</td>
<td>−2.5 V</td>
<td>✓ full load</td>
</tr>
</tbody>
</table>
<p><em>True for <strong>any</strong> valid gain split — the ratios fall out to make it so.</em></p>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:26px;">
<p><strong>Watch the sign of the v_INA term.</strong></p>
<p>As load increases → v_INA increases → v_ADC <strong>decreases</strong>.</p>
<p>The ADC reading goes <strong>down</strong> as weight goes <strong>up</strong>.</p>
<p><em>This is not a bug. It is what the inverting summing amplifier does.</em></p>
</div>
</div>

<p><strong>PAUSE THE VIDEO AND CHOOSE YOUR ANSWER.</strong></p>
<blockquote>
<p>You have built and powered your complete signal chain. You place a 500 g weight on the load cell. The M2K ADC reading goes down. What does this tell you?</p>

</ul>
</blockquote>
</section>

<p>You have built and powered your complete signal chain. You place a 500 g weight on the load cell. The M2K ADC reading goes down. What does this tell you?</p>

<h2 id="ryh-q3--adc-reading-goes-down-under-load-2">RYH Q3 — ADC Reading Goes Down Under Load</h2>
<p><strong>PAUSE THE VIDEO AND CHOOSE YOUR ANSWER.</strong></p>
<blockquote>
<p>You have built and powered your complete signal chain. You place a 500 g weight on the load cell. The M2K ADC reading goes down. What does this tell you?</p>
<ul>
<li>A)   The INA125 inputs are wired backward — swap V+ and V− at the sensor</li>
<li>B)   The summing amplifier op-amp has failed — it is inverting when it should not be</li>

<h2 id="ryh-q3--adc-reading-goes-down-under-load-3">RYH Q3 — ADC Reading Goes Down Under Load</h2>
<p><strong>PAUSE THE VIDEO NOW AND PICK ONE.</strong></p>
<blockquote>
<p>You have built and powered your complete signal chain. You place a 500 g weight on the load cell. The M2K ADC reading goes down. What does this tell you?</p>
<ul>
<li>A)   The INA125 inputs are wired backward — swap V+ and V− at the sensor</li>
<li>B)   The summing amplifier op-amp has failed — it is inverting when it should not be</li>
<li>C)   This is expected — the inverting summing amplifier produces a negative slope, and calibration handles it</li>
<li>D)   The gain is too high and the INA output is clipping</li>
</ul>
</blockquote>
</section>

<h2 id="pre-lab-design-document--due-tuesday-900-am">Pre-Lab Design Document — Due Tuesday 9:00 AM</h2>
<div style="display:flex;gap:40px;margin-top:8px;">
<div style="flex:1;">
<p><strong>Five deliverables</strong></p>
<ol>
<li><strong>Gain split</strong> — chosen G_INA and G_summing with justification (why split here, what would have gone wrong otherwise); R_g value follows</li>
<li><strong>Summing amp ratios</strong> — R_f/R_a and R_f/R_b derived from the two boundary conditions for <em>your</em> v_INA,max; transfer function verified at both endpoints</li>
<li><strong>Theoretical resolution</strong> — grams per ADC count (target: 500 g / 4096 ≈ 0.12 g)</li>
<li><strong>INA125 pinout</strong> — annotated, every pin labeled (including IAref)</li>
<li><strong>Breadboard plan</strong> — stage separation visible; show the two pots (gain trim, offset trim)</li>
</ol>
<p><em>Without these, the team does not yet have a design.</em></p>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:26px;">
<p><strong>Bring-up is staged</strong></p>
<ol>
<li>INA alone — balanced-bridge test (4 × 1 kΩ)</li>
<li>Summing amp alone — DC substituted for v_INA</li>
<li>Connect them — verify endpoints</li>
<li>Connect load cell — measure baseline and known weight</li>
</ol>
<p><strong>Deadlines</strong></p>
<ul>
<li>Pre-lab → Tue 9:00 AM</li>
<li>Phase 1 milestone → Sat Week 8 noon</li>
<li>Phase 2 → next week</li>
</ul>
